name: Build QuestLoader Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Package Extension into ZIP
      run: |
        mkdir -p build
        cd extension
        zip -r ../build/QuestLoader.zip .
        cd ..

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuestLoader-zip
        path: build/QuestLoader.zip
